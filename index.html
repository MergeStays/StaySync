<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Immediately suppress HMR WebSocket errors per AI Studio environment constraints (HMR disabled in container)
      (function() {
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var msg = args.map(function(a) {
            return (a && (a.message || a.stack)) || String(a);
          }).join(' ');
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('closed without opened') !== -1 ||
            msg.indexOf('[vite]') !== -1
          ) {
            return;
          }
          return origConsoleError.apply(console, args);
        };

        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            var isHmr = (typeof protocols === 'string' && protocols === 'vite-hmr') ||
                        (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
                        (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('/@vite') !== -1));
            if (isHmr) {
              var mockSocket = {
                readyState: 1, // WebSocket.OPEN
                url: url,
                protocol: 'vite-hmr',
                bufferedAmount: 0,
                extensions: '',
                binaryType: 'blob',
                onopen: null,
                onclose: null,
                onmessage: null,
                onerror: null,
                send: function() {},
                close: function() {},
                addEventListener: function(type, cb) {
                  if (type === 'open') {
                    setTimeout(function() {
                      try { cb.call(mockSocket, { type: 'open', target: mockSocket }); } catch(err) {}
                    }, 0);
                  }
                },
                removeEventListener: function() {},
                dispatchEvent: function() { return true; }
              };
              setTimeout(function() {
                if (typeof mockSocket.onopen === 'function') {
                  try { mockSocket.onopen.call(mockSocket, { type: 'open', target: mockSocket }); } catch(err) {}
                }
              }, 0);
              return mockSocket;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          window.WebSocket.OPEN = NativeWebSocket.OPEN;
          window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
          window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
        }

        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && (e.error.message || e.error.stack)))) || '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('closed without opened') !== -1 ||
            msg.indexOf('vite') !== -1
          ) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var msg = (e && e.reason && (e.reason.message || e.reason.stack || String(e.reason))) || '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('closed without opened') !== -1 ||
            msg.indexOf('vite') !== -1
          ) {
            e.preventDefault();
            return true;
          }
        });
      })();
    </script>
